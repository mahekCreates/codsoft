<section id="contact" class="info-section">
    <h2>Book Your Gaming Slot</h2>

    <form class="booking-form">
        <input type="text" name="name" placeholder="Your Name" required>
        <input type="email" name="email" placeholder="Your Email" required>

        <select name="game" required>
            <option value="" disabled selected>Select Game</option>
            <option>Multiplayer Arenas</option>
            <option>FPS & Shooter</option>
            <option>Racing & Sports</option>
            <option>VR Adventures</option>
        </select>

        <textarea name="message" placeholder="Message (optional)"></textarea>

        <button type="submit" class="cta-button">Submit Booking</button>

        <div class="success-message">
            ✅ Booking Confirmed! See you at ZenCafe 🎮
        </div>
    </form>
</section>
